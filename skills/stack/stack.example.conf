# Copy to stack.local.conf (gitignored) and fill in; stack.sh sources it.

# The app's main checkout; its worktrees are the ones that get stacks.
MAIN=/path/to/main/checkout
# Prefix for slot containers (<prefix>-db-wt<N>) and compose projects (<prefix>-wt<N>).
NAME_PREFIX=myapp
# Postgres service name in the app's backend/docker-compose.yml.
DB_SERVICE=myapp-db
# Container running the main checkout's Postgres, seeded from and holding the shared credentials database.
MAIN_CONTAINER=myapp-db-postgres
# Database (and Alembic ini name) shared from main: never migrated in a slot, dropped from the copy.
CREDENTIALS_DB=credentials
# URL every slot's backend uses for the shared credentials database (main's Postgres on 5435).
CREDENTIALS_URL="postgresql+asyncpg://user:password@127.0.0.1:5435/credentials"
# Env var that carries CREDENTIALS_URL into the backend.
CREDENTIALS_URL_VAR=CREDENTIALS_DATABASE_URL
# Env var holding the credentials encryption key, and the file holding main's value; the two must match.
ENCRYPTION_KEY_VAR=ENCRYPTION_KEY
ENCRYPTION_KEY_FILE="$MAIN/backend/.env"
# One "<database>|<SQL>" per line, run in a fresh copy so it never repeats main's background work.
NEUTRALIZE_SQL="jobs|UPDATE jobs SET status = 'PAUSED' WHERE status = 'ACTIVE'"
# One "<database>|<label>|<count SQL>" per line; every count must be 0 after NEUTRALIZE_SQL.
LIVE_WORK_SQL="jobs|active jobs|SELECT count(*) FROM jobs WHERE status = 'ACTIVE'"
# Optional extra env, one KEY=VALUE per line; {web_port}, {backend_port}, {db_port}, and {web_url}
# are filled in per slot. WEB_ENV goes to the web job, BACKEND_ENV into the generated backend env file.
# WEB_ENV="PUBLIC_HOST_SUFFIX=localhost:{web_port}
# PUBLIC_ORIGIN={web_url}"
# BACKEND_ENV="SOME_FEATURE_FLAG=true"
# Optional overrides: registry directory and launchd label prefix.
# REGISTRY="$HOME/.local/state/cc-forge-stack"
# LABEL_PREFIX=local.cc-forge-stack
